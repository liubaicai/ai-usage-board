services:
  ai-usage-board:
    # 直接拉取 GHCR 现成镜像（由 GitHub Actions 在每次 push 后自动构建推送）
    image: ghcr.io/liubaicai/ai-usage-board:latest
    container_name: ai-usage-board
    restart: unless-stopped
    ports:
      # 宿主机端口:容器内端口（如需修改外部访问端口，改左侧即可）
      - "5173:5173"
    volumes:
      # 数据持久化：store.json（含所有账号配置与 API Key）保存在宿主机 ./data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # - TZ=Asia/Shanghai   # 如需要可指定容器时区

    # 容器内用户 uid=1000，如宿主机 ./data 属主不是 1000 则需覆盖。
    # 方法一（推荐）：sudo chown -R 1000:1000 ./data
    # 方法二：取消下面注释并填入宿主机用户的 uid:gid（id -u && id -g 查看）
    # user: "1000:1000"
