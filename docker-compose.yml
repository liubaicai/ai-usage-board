services:
  ai-usage-board:
    # 直接拉取 GHCR 现成镜像（由 GitHub Actions 在每次 push 后自动构建推送）
    image: ghcr.io/liubaicai/ai-usage-board:latest
    container_name: ai-usage-board
    restart: unless-stopped
    ports:
      # 宿主机端口:容器内端口（如需修改外部访问端口，改左侧即可）
      - "5173:5173"
    volumes:
      # 数据持久化：store.json（含所有账号配置与 API Key）保存在宿主机 ./data
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # - TZ=Asia/Shanghai   # 如需要可指定容器时区
