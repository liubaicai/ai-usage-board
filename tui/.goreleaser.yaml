version: 2

project_name: ai-usage-tui

builds:
  - id: ai-usage-tui
    main: ./cmd/ai-usage-tui
    binary: ai-usage-tui
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # 只发布 4 个目标：windows x64 / linux x64 / linux arm / mac arm
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: binaries
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # v2 语法：归档内附加自定义文件用 files（extra_files 不是合法字段）
    files:
      - config.demo.toml
checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
